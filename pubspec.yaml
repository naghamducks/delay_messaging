name: delay_messenger
description: A DTN (Delay Tolerant Network) messaging application for offline-first communication

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  bluetooth_low_energy: ^6.0.2
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  flutter_map_cancellable_tile_provider: ^3.0.0
  maplibre_gl: ^0.22.0
  http: ^1.2.0
  archive: ^3.6.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/maps/
    - assets/fonts/
    - assets/fonts/Noto Sans Regular/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/appIcon.png"